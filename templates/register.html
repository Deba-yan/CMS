{% extends "base.html" %}{% block title %}Register{% endblock %}{% block body %}
<div class="auth card"><h1>Create account</h1><p class="sub">Join as an author, reviewer or participant.</p>
<form method="post"><label>Full name</label><input name="name" required>
<label>Email</label><input name="email" type="email" required>
<label>Password (6+ characters)</label><input name="password" type="password" minlength="6" required>
<label>I am a…</label><select name="role"><option value="author">Author (submit papers)</option>
<option value="reviewer">Reviewer (review papers)</option><option value="participant">Participant (attend)</option></select>
<button style="width:100%">Register</button></form>
<p class="muted">Have an account? <a href="{{ url_for('login') }}">Log in</a></p></div>{% endblock %}
